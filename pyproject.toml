[project]
name = "pyram"
version = "1.3.0"
description = "Python adaptation of the Range-dependent Acoustic Model (RAM)"
authors = [
    { name = "Marcus Donnelly", email = "marcus.k.donnelly@gmail.com" }
]
license = { file = "LICENSE.md" }
readme = "README.md"

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

keywords = [
    "acoustics",
    "underwater acoustics",
    "parabolic equation",
    "ocean acoustics",
    "ram"
]

requires-python = ">=3.10"

dependencies = [
    "numpy>=1.25",
    "numba>=0.58",
]

[project.optional-dependencies]
plot =["matplotlib>=3.8.0"]

[dependency-groups]
test = [
    "matplotlib>=3.8.0",
    "mypy>=1.11.2",
    "pytest>=8.0",
    "ruff>=0.12",
]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["B",  # flake8-bugbear
          "C4", # flake8-comprehensions
          "E4", # pycodestyle import checks
          "E7", # pycodestyle statement checks
          "E9", # pycodestyle runtime checks
          "E501", # pycodestyle linelength checks
          "F",  # PyFlakes
          "I",  # isort
          "Q",
          "UP", # pyupgrade
          ]

# On top of the numpy convention, disable `D417`, which requires
# documentation for every function parameter.
ignore = ["D417"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
#docstring-code-format = true
docstring-code-line-length = 100

[tool.pytest.ini_options]
# Register all custom markers here.
markers = [
    "slow: marks tests as slow (time-consuming)",
    "benchmark: marks tests used for benchmarking",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "IGNORE_EXCEPTION_DETAIL",
    "ELLIPSIS"
]
addopts = "-rsxXf"
testpaths = [
    "src"
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.scripts]
lock = "pdm lock -dG all"
lock-py314 = "pdm lock -L pdm.lock314 --python 3.14 --strategy no_direct_minimal_versions -dG all"
lock-all = {composite = ["lock", "lock-py314"]}

format = "ruff format ./src/"  # format code
check-style = "ruff check ./src/"  # check code style
check-types = "mypy ./src/"  # check types
tests = {cmd = "pytest", env = {MPLBACKEND = "Agg"}}
test = {composite = ["tests"]}
all-tests = {composite = ["format", "check-style", "check-types", "tests"]}
